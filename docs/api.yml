openapi: 3.0.3
info:
  title: 'Playground Directory API'
  description: 'Playground: Provides an API, without a UI for interacting with Playground Directory, a Directory System for Laravel applications.'
  version: 75.0.0
externalDocs:
  url: 'https://gammamatrix-playground.readthedocs.io/en/develop/components/directory.html'
  description: 'Read the Docs: Playground Directory Packages'
servers:
  -
    url: 'https://api.example.com'
    description: 'Production Server'
  -
    url: 'https://api.staging.example.com'
    description: 'Staging Server'
  -
    url: 'https://api.dev.example.com'
    description: 'Dev Server'
  -
    url: 'http://localhost'
    description: 'Local Server'
tags:
  -
    name: Contact
    description: 'Manage contacts in storage.'
  -
    name: Location
    description: 'Manage locations in storage.'
  -
    name: Tag
    description: 'Manage tags in storage.'
paths:
  '/api/directory/contacts/{id}':
    $ref: paths/contacts/id.yml
  /api/directory/contacts:
    $ref: paths/contacts/index.yml
  /api/directory/contacts/index:
    $ref: paths/contacts/index-form.yml
  '/api/directory/contacts/lock/{id}':
    $ref: paths/contacts/lock.yml
  '/api/directory/contacts/restore/{id}':
    $ref: paths/contacts/restore.yml
  '/api/directory/contacts/revision/{id}':
    $ref: paths/contacts/revision.yml
  '/api/directory/contacts/{id}/revisions':
    $ref: paths/contacts/revisions.yml
  /api/directory/contacts/create:
    $ref: paths/contacts/create.yml
  '/api/directory/contacts/edit/{id}':
    $ref: paths/contacts/edit.yml
  '/api/directory/locations/{id}':
    $ref: paths/locations/id.yml
  /api/directory/locations:
    $ref: paths/locations/index.yml
  /api/directory/locations/index:
    $ref: paths/locations/index-form.yml
  '/api/directory/locations/lock/{id}':
    $ref: paths/locations/lock.yml
  '/api/directory/locations/restore/{id}':
    $ref: paths/locations/restore.yml
  '/api/directory/locations/revision/{id}':
    $ref: paths/locations/revision.yml
  '/api/directory/locations/{id}/revisions':
    $ref: paths/locations/revisions.yml
  /api/directory/locations/create:
    $ref: paths/locations/create.yml
  '/api/directory/locations/edit/{id}':
    $ref: paths/locations/edit.yml
  '/api/directory/tags/{id}':
    $ref: paths/tags/id.yml
  /api/directory/tags:
    $ref: paths/tags/index.yml
  /api/directory/tags/index:
    $ref: paths/tags/index-form.yml
  '/api/directory/tags/lock/{id}':
    $ref: paths/tags/lock.yml
  '/api/directory/tags/restore/{id}':
    $ref: paths/tags/restore.yml
  /api/directory/tags/create:
    $ref: paths/tags/create.yml
  '/api/directory/tags/edit/{id}':
    $ref: paths/tags/edit.yml
components:
  schemas:
    Contact:
      $ref: models/contact.yml
    ContactRevision:
      $ref: models/contact-revision.yml
    Location:
      $ref: models/location.yml
    LocationRevision:
      $ref: models/location-revision.yml
    Tag:
      $ref: models/tag.yml
